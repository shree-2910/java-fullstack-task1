<!DOCTYPE html>
<html>
<head>
    <title>Contact Dashboard</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .dashboard{
            background:white;
            width:80%;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th, td{
            border:1px solid black;
            padding:10px;
            text-align:center;
        }

        th{
            background:black;
            color:white;
        }
    </style>
</head>

<body>

<nav>
    <h2>Contact Dashboard</h2>
</nav>

<h1>Saved Contacts</h1>

<div class="dashboard">

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Message</th>
            </tr>
        </thead>

        <tbody id="tableBody">

        </tbody>
    </table>

    <br>

    <button onclick="window.location.href='index.html'">
        Back to Form
    </button>

</div>

<footer>
    <p>Created by Shree</p>
</footer>

<script>

fetch("http://localhost:8080/contacts")
.then(response => response.json())
.then(data => {

    let tableBody = document.getElementById("tableBody");

    data.forEach(contact => {

        tableBody.innerHTML += `
            <tr>
                <td>${contact.id}</td>
                <td>${contact.name}</td>
                <td>${contact.email}</td>
                <td>${contact.message}</td>
            </tr>
        `;
    });

})
.catch(error => console.error(error));

</script>

</body>
</html>
