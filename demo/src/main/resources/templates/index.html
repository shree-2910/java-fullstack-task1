<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Contact Form</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<nav>
    <h2>Contact Form</h2>
</nav>

<h1>Welcome to My Website</h1>

<form id="contactForm">

    <input type="text"
           id="name"
           placeholder="Enter Name"
           required>

    <br><br>

    <input type="email"
           id="email"
           placeholder="Enter Email"
           required>

    <br><br>

    <textarea id="message"
              placeholder="Enter Message"
              required></textarea>

    <br><br>

    <button type="submit">
        Submit
    </button>

    <button type="button"
            onclick="window.location.href='/dashboard'">
        View Contacts
    </button>

</form>

<footer>
    <p>Created by Shree</p>
</footer>

<p id="response"></p>

<script src="/script.js"></script>

</body>
</html>
